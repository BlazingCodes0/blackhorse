<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" font-family="Arial, sans-serif">
  <rect width="1200" height="800" fill="#0f1420"/>
  <text x="600" y="45" text-anchor="middle" fill="#fff" font-size="26" font-weight="bold">BLACKHORSE — Hybrid Model Approach (local by default)</text>
  <text x="600" y="72" text-anchor="middle" fill="#9fb3c8" font-size="13">API only where reasoning matters • Ollama for everything high-volume • fallback local if API fails</text>

  <!-- Brain -->
  <rect x="80" y="110" width="340" height="150" rx="12" fill="#1c2740" stroke="#4f7cff"/>
  <text x="100" y="140" fill="#7fa8ff" font-size="18" font-weight="bold">BRAIN (decides, monitors)</text>
  <text x="100" y="165" fill="#e6ecff" font-size="13">• Primary: Claude / GPT-4 class via API</text>
  <text x="100" y="188" fill="#e6ecff" font-size="13">• Orchestration: LangGraph / CrewAI</text>
  <text x="100" y="211" fill="#e6ecff" font-size="13">• Fallback: Ollama Llama 3.x (local)</text>
  <text x="100" y="240" fill="#8ea3c8" font-size="11">Low volume, high stakes → worth the API cost</text>

  <!-- Heart -->
  <rect x="430" y="110" width="340" height="150" rx="12" fill="#3a1c26" stroke="#ff5f7a"/>
  <text x="450" y="140" fill="#ff8ba0" font-size="18" font-weight="bold">HEART (safety filter)</text>
  <text x="450" y="165" fill="#ffe6ea" font-size="13">• Default: hard rules + regex (Python), free</text>
  <text x="450" y="188" fill="#ffe6ea" font-size="13">• LLM pass: Ollama local (Llama 3.x / Mistral)</text>
  <text x="450" y="211" fill="#ffe6ea" font-size="13">• Escalate to API model only on ambiguity</text>
  <text x="450" y="240" fill="#c8a0a8" font-size="11">Never rely on LLM alone for safety</text>

  <!-- Motar -->
  <rect x="780" y="110" width="340" height="150" rx="12" fill="#1c3a2a" stroke="#43d17c"/>
  <text x="800" y="140" fill="#7fe0a8" font-size="18" font-weight="bold">MOTAR (does the work)</text>
  <text x="800" y="165" fill="#e6fff0" font-size="13">• Default: Ollama local (Llama 3.x, Mistral)</text>
  <text x="800" y="188" fill="#e6fff0" font-size="13">• Research: GPT-Researcher / Crawl4AI + local LLM</text>
  <text x="800" y="211" fill="#e6fff0" font-size="13">• Coding tasks: Ollama + Aider / OpenHands</text>
  <text x="800" y="240" fill="#a0c8b0" font-size="11">High volume → local keeps cost near $0</text>

  <!-- Flow arrows -->
  <path d="M420 185 L430 185" stroke="#888" stroke-width="2" marker-end="url(#a)"/>
  <path d="M770 185 L780 185" stroke="#888" stroke-width="2" marker-end="url(#a)"/>
  <text x="425" y="170" fill="#9fb3c8" font-size="10" text-anchor="middle">task</text>
  <text x="775" y="170" fill="#9fb3c8" font-size="10" text-anchor="middle">act</text>

  <!-- Trading -->
  <rect x="80" y="310" width="500" height="150" rx="12" fill="#2e2a14" stroke="#ffd24f"/>
  <text x="100" y="340" fill="#ffd97f" font-size="18" font-weight="bold">TRADING stream</text>
  <text x="100" y="365" fill="#fff6d9" font-size="13">• LEAN (QuantConnect): backtesting, no LLM needed</text>
  <text x="100" y="388" fill="#fff6d9" font-size="13">• Market summary: local LLM on qubitFlow data</text>
  <text x="100" y="411" fill="#fff6d9" font-size="13">• qubitFlowBeta: unchanged, still the money-mover</text>
  <text x="100" y="440" fill="#c8b88a" font-size="11">LLM never trades directly — it only summarizes/proposes</text>

  <!-- Monitoring / security -->
  <rect x="620" y="310" width="500" height="150" rx="12" fill="#142e3a" stroke="#4fd2ff"/>
  <text x="640" y="340" fill="#8ae4ff" font-size="18" font-weight="bold">MONITORING &amp; SECURITY (the skin/bones)</text>
  <text x="640" y="365" fill="#e0f7ff" font-size="13">• Phoenix (Arize): trace every agent decision</text>
  <text x="640" y="388" fill="#e0f7ff" font-size="13">• Langfuse (alt): self-hosted tracing + cost tracking</text>
  <text x="640" y="411" fill="#e0f7ff" font-size="13">• Secrets: .env, never commit keys; OpenBao later</text>
  <text x="640" y="440" fill="#8ab8c8" font-size="11">Append-only JSONL logs of every action + heart verdict</text>

  <!-- defaults -->
  <rect x="80" y="520" width="1040" height="180" rx="12" fill="#181818" stroke="#555"/>
  <text x="100" y="552" fill="#fff" font-size="16" font-weight="bold">Default by default (fallback order)</text>
  <text x="100" y="582" fill="#ccc" font-size="13">1. Decision that affects money/public posting → API model (Claude/GPT) via brain, then heart</text>
  <text x="100" y="608" fill="#ccc" font-size="13">2. Everything else → Ollama local first (Llama 3.x / Mistral), no API spend</text>
  <text x="100" y="634" fill="#ccc" font-size="13">3. Safety checks → hard rules ALWAYS run, LLM is second opinion only</text>
  <text x="100" y="660" fill="#ccc" font-size="13">4. If API is down/over budget → brain falls back to local model + logs degraded mode to Phoenix</text>
  <text x="100" y="686" fill="#ff9" font-size="12">Rule of thumb: local by default, API only when reasoning quality is worth paying for.</text>

  <defs>
    <marker id="a" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 z" fill="#888"/></marker>
  </defs>
</svg>
